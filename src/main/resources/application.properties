# ---------------------------------------------------------------------------
# Bank / Loan Management System - runtime configuration
#
# NO SECRETS IN THIS FILE. Every credential is read from the environment.
# For local development copy `.env.example` to `.env` (git-ignored) - Spring
# picks it up automatically via the `spring.config.import` line at the bottom.
# ---------------------------------------------------------------------------

spring.application.name=lms

# --- Server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=always
# Session cookie hardening. `secure` is auto-enabled under HTTPS profiles.
server.servlet.session.cookie.name=LMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
# `secure` has to be set explicitly in production rather than relying on an
# HTTPS profile, which does not exist here. It defaults to false so plain-HTTP
# local development still works; SESSION_COOKIE_SECURE=true is set in render.yaml.
# A session cookie without `secure` is sent over cleartext HTTP, where it can be
# read straight off the wire.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Required when the app sits behind a reverse proxy (Vercel -> Render). Without
# it the app believes it is on http://, and would build redirects and cookie
# decisions against the wrong scheme.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson ---
# NOTE: there is deliberately no `write-dates-as-timestamps` setting here.
# Under Jackson 2 this was needed to stop dates serialising as epoch numbers.
# Jackson 3 (Spring Boot 4.1) moved WRITE_DATES_AS_TIMESTAMPS out of
# SerializationFeature into DateTimeFeature and flipped its default to off, so
# dates are already written as ISO-8601 strings. Spring Boot 4 exposes no
# property for DateTimeFeature, which is why there is nothing to set. The old
# line here did not just become redundant - it made the context fail to start,
# because a key that no longer binds to SerializationFeature is a hard error.
spring.jackson.default-property-inclusion=non_null

# --- Seed data (creates the bootstrap ADMIN account on first run) ---
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# --- Demo dataset (100 customers + their logins + loans, one transaction) ---
# Off by default: these rows have known passwords, so they must be opted into
# rather than arriving by default. Set SAMPLE_DATA_ENABLED=true locally.
app.sample-data.enabled=${SAMPLE_DATA_ENABLED:false}
app.sample-data.customers=${SAMPLE_DATA_CUSTOMERS:100}

# --- CORS (only needed when the frontend is NOT served same-origin) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Local .env support (git-ignored) ---
spring.config.import=optional:file:.env[.properties]
