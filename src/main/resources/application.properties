# ---------------------------------------------------------------------------
# Bank / Loan Management System - runtime configuration
#
# NO SECRETS IN THIS FILE. Every credential is read from the environment.
# For local development copy `.env.example` to `.env` (git-ignored) - Spring
# picks it up automatically via the `spring.config.import` line at the bottom.
# ---------------------------------------------------------------------------

spring.application.name=lms

# --- Server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=always
# Session cookie hardening. `secure` is auto-enabled under HTTPS profiles.
server.servlet.session.cookie.name=LMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- Seed data (creates the bootstrap ADMIN account on first run) ---
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# --- Local .env support (git-ignored) ---
spring.config.import=optional:file:.env[.properties]
