# ---------------------------------------------------------------------------
# Overrides for the @SpringBootTest context test.
#
# Activated with @ActiveProfiles("test") in
# src/test/java/com/bank/lms/PersistenceMappingTest.java.
#
# The application itself runs on MySQL; this profile exists so the build can
# construct a real EntityManagerFactory and a real security filter chain without
# a developer's database or credentials being involved.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:lms-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop, not update: the schema is rebuilt from the entity model on every
# run, so a test can never pass against a table left behind by an earlier one.
spring.jpa.hibernate.ddl-auto=create-drop

# Deliberately off. The application bean initialisers that seed an admin login
# and 100 demo customers both run on ApplicationRunner, and neither is what this
# test is checking - letting them fire would add seconds per run and would make
# the test fail for reasons that have nothing to do with the schema.
app.bootstrap-admin.enabled=false
app.sample-data.enabled=false
